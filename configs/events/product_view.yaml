name: product_view
version: 2
description: User views a product

schema:
  user_id:
    type: string
    required: true
  visit_id:
    type: string
    required: true
  product_id:
    type: string
    required: true
  request_id:
    type: string
    required: true
  dwell_time:
    type: float
    required: false
  ts:
    type: timestamp
    required: true

default_destination: analytics_db